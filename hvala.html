<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hvala! – Pure Aesthetic</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://drdraganailic.com/hvala.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F5F0EB;
      --burgundy: #6B1A2A;
      --charcoal: #1A1A1A;
      --warm-gray: #8A8278;
      --gold: #C9A96E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .checkmark {
      width: 64px; height: 64px;
      border: 1.5px solid var(--burgundy);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2.5rem;
      font-size: 1.5rem;
      color: var(--burgundy);
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem; font-weight: 300;
      margin-bottom: 1rem;
    }
    h1 em { font-style: italic; color: var(--burgundy); }
    p {
      font-size: 0.9rem; line-height: 1.85;
      color: var(--warm-gray); max-width: 400px;
      margin: 0 auto 2.5rem;
    }
    a {
      display: inline-block;
      border: 1px solid var(--burgundy);
      color: var(--burgundy);
      padding: 0.85rem 2.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all .25s;
    }
    a:hover { background: var(--burgundy); color: #fff; }
    .logo {
      position: fixed; top: 2rem; left: 50%; transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; letter-spacing: 0.08em;
      color: var(--charcoal);
    }
  </style>
</head>
<body>
  <span class="logo">Pure Aesthetic</span>
  <div class="checkmark">✓</div>
  <h1>Hvala na <em>poruci!</em></h1>
  <p>Vaša poruka je uspješno primljena. Javićemo se u najkraćem roku, najkasnije u roku od 24 sata.</p>
  <a href="index.html">← Nazad na sajt</a>
</body>
</html>
